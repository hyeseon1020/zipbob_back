spring.application.name=zipbob_backend

# Render ?? ??
server.port=${PORT:10000}
server.forward-headers-strategy=framework

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER_NAME}
spring.datasource.password=${DB_PASSWORD}

# ?? ???? ??? ??
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=zipbob_app
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# DB ?? ? ??
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000

# JWT
jwt.secret=${JWT_SECRET}
jwt.issuer=zipbob
jwt.access-token-expiration-seconds=1800
jwt.refresh-token-expiration-days=14

# ?? ??? ?? ??? ?? ????
admin.bootstrap.enabled=false

# ??? ?? ??
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# ??? ?? ?? ??
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Render ?? ??? ??: ?? ???? ??
app.menu-image-dir=/tmp/zipbob/images/menus

# ?? ??: Brevo HTTPS API
app.mail.brevo-api-key=${BREVO_API_KEY}
app.mail.from=${MAIL_FROM}

# ?? ??? ?? ?? ?? ??
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ? ???? API ??? ??? ??
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}