<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/fragments/layout :: layout('대시보드', 'dashboard', ~{::content})}">
<body>

<section th:fragment="content">
    <div class="welcome-card">
        <div>
            <span class="eyebrow">집밥PICK 운영 공간</span>

            <h2>오늘도 맛있는 선택을 도와주세요.</h2>

            <p>메뉴부터 회원까지, 필요한 관리를 한곳에서 시작하세요.</p>
        </div>

        <span class="welcome-icon" aria-hidden="true">
            <svg class="icon">
                <use th:href="@{/admin/images/admin-icons.svg#bowl}"></use>
            </svg>
        </span>
    </div>

    <div class="section-heading">
        <h2>빠른 이동</h2>
        <p class="text-muted">관리할 항목을 선택해 주세요.</p>
    </div>

    <div class="dashboard-grid">
        <a class="shortcut-card" th:href="@{/admin/menus}">
            <span class="card-icon" aria-hidden="true">
                <svg class="icon">
                    <use th:href="@{/admin/images/admin-icons.svg#bowl}"></use>
                </svg>
            </span>

            <h3>메뉴 관리</h3>
            <p>집밥PICK의 메뉴와 레시피를 관리해요.</p>

            <span class="card-link">
                메뉴 관리로 이동
                <svg class="icon" aria-hidden="true">
                    <use th:href="@{/admin/images/admin-icons.svg#arrow}"></use>
                </svg>
            </span>
        </a>

        <a class="shortcut-card" th:href="@{/admin/codes}">
            <span class="card-icon" aria-hidden="true">
                <svg class="icon">
                    <use th:href="@{/admin/images/admin-icons.svg#codes}"></use>
                </svg>
            </span>

            <h3>공통코드 관리</h3>
            <p>카테고리와 분류 항목을 관리해요.</p>

            <span class="card-link">
                공통코드 관리로 이동
                <svg class="icon" aria-hidden="true">
                    <use th:href="@{/admin/images/admin-icons.svg#arrow}"></use>
                </svg>
            </span>
        </a>

        <a class="shortcut-card" th:href="@{/admin/users}">
            <span class="card-icon" aria-hidden="true">
                <svg class="icon">
                    <use th:href="@{/admin/images/admin-icons.svg#users}"></use>
                </svg>
            </span>

            <h3>회원 관리</h3>
            <p>집밥PICK을 이용하는 회원을 관리해요.</p>

            <span class="card-link">
                회원 관리로 이동
                <svg class="icon" aria-hidden="true">
                    <use th:href="@{/admin/images/admin-icons.svg#arrow}"></use>
                </svg>
            </span>
        </a>
    </div>
</section>

</body>
</html>
