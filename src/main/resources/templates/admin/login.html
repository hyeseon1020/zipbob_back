<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>관리자 로그인 | 집밥PICK</title>

    <link rel="stylesheet" th:href="@{/admin/css/admin.css}">
</head>

<body class="login-page">

<main class="login-card">
    <img class="login-logo"
         th:src="@{/admin/images/zipbob_pick_logo.png}"
         alt="집밥PICK">

    <span class="brand-badge">관리자</span>

    <h1>관리자 로그인</h1>

    <p class="text-muted login-description">
        집밥PICK 운영을 시작해 보세요.
    </p>

    <p th:if="${param.error != null}"
       class="form-error"
       role="alert">
        아이디 또는 비밀번호를 확인해 주세요.
        관리자 계정만 로그인할 수 있습니다.
    </p>

    <p th:if="${param.logout != null}"
       class="form-notice"
       role="status">
        로그아웃되었습니다.
    </p>

    <form th:action="@{/admin/login}" method="post">
        <div class="form-group">
            <label class="form-label" for="userId">아이디</label>

            <input class="form-control"
                   type="text"
                   id="userId"
                   name="userId"
                   placeholder="관리자 아이디"
                   autocomplete="username"
                   autocapitalize="none"
                   spellcheck="false"
                   maxlength="50"
                   required>
        </div>

        <div class="form-group">
            <label class="form-label" for="userPw">비밀번호</label>

            <input class="form-control"
                   type="password"
                   id="userPw"
                   name="userPw"
                   placeholder="비밀번호"
                   autocomplete="current-password"
                   required>
        </div>

        <button class="btn btn-primary" type="submit">
            로그인
        </button>
    </form>
</main>

</body>
</html>
